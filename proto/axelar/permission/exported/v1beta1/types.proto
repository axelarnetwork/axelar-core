syntax = "proto3";
package axelar.permission.exported.v1beta1;

option go_package = "github.com/axelarnetwork/axelar-core/x/permission/exported";

import "gogoproto/gogo.proto";
import "google/protobuf/descriptor.proto";

option (gogoproto.goproto_getters_all) = false;

enum Role {
  option (gogoproto.goproto_enum_prefix) = false;
  option (gogoproto.goproto_enum_stringer) = true;

  ROLE_UNSPECIFIED = 0;
  ROLE_UNRESTRICTED = 1;
  ROLE_CHAIN_MANAGEMENT = 2;
  ROLE_ACCESS_CONTROL = 3;
}

extend google.protobuf.MessageOptions {
  permission.exported.v1beta1.Role permission_role =
      50000; // 50000-99999 reserved for use withing individual organizations
}

// PauseLevel defines how much of the chain's transaction intake is blocked by
// an emergency pause. Every level only allows the messages in its allowlist
// (see EmergencyPauseAllowlist in x/permission/exported).
enum PauseLevel {
  option (gogoproto.goproto_enum_prefix) = false;
  option (gogoproto.goproto_enum_stringer) = true;

  // the chain is not paused (the zero value is required to be _UNSPECIFIED)
  PAUSE_LEVEL_UNSPECIFIED = 0;
  // only the messages needed to change the pause level, unpause or halt the
  // chain are allowed
  PAUSE_LEVEL_ALL = 1;
  // like PAUSE_LEVEL_ALL, but validator liveness messages and permission key
  // rotation are also allowed
  PAUSE_LEVEL_EXCEPT_VALIDATORS = 2;
}
