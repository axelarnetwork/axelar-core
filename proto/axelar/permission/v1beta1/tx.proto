syntax = "proto3";
package axelar.permission.v1beta1;

option go_package = "github.com/axelarnetwork/axelar-core/x/permission/types";

import "gogoproto/gogo.proto";
import "axelar/permission/v1beta1/params.proto";
import "cosmos/crypto/multisig/keys.proto";
import "axelar/permission/exported/v1beta1/types.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/msg/v1/msg.proto";
import "amino/amino.proto";

option (gogoproto.goproto_getters_all) = false;

message UpdateGovernanceKeyRequest {
  option (amino.name) = "permission/UpdateGovernanceKey";
  option (permission.exported.v1beta1.permission_role) = ROLE_ACCESS_CONTROL;
  option (cosmos.msg.v1.signer) = "sender";

  // DEPRECATED: This field is deprecated but must remain to ensure backward
  // compatibility. Removing this field would break decoding of historical
  // transactions. DO NOT use in new code.
  bytes sender_deprecated = 1 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    deprecated = true
  ];
  cosmos.crypto.multisig.LegacyAminoPubKey governance_key = 2
      [ (gogoproto.nullable) = false ];
  string sender = 3 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

message UpdateGovernanceKeyResponse {}

// MsgRegisterController represents a message to register a controller account
message RegisterControllerRequest {
  option (amino.name) = "permission/RegisterController";
  option (permission.exported.v1beta1.permission_role) = ROLE_ACCESS_CONTROL;
  option (cosmos.msg.v1.signer) = "sender";

  // DEPRECATED: This field is deprecated but must remain to ensure backward
  // compatibility. Removing this field would break decoding of historical
  // transactions. DO NOT use in new code.
  bytes sender_deprecated = 1 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    deprecated = true
  ];
  bytes controller = 2 [ (gogoproto.casttype) =
                             "github.com/cosmos/cosmos-sdk/types.AccAddress" ];
  string sender = 3 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

message RegisterControllerResponse {}

// DeregisterController represents a message to deregister a controller account
message DeregisterControllerRequest {
  option (amino.name) = "permission/DeregisterController";
  option (permission.exported.v1beta1.permission_role) = ROLE_ACCESS_CONTROL;
  option (cosmos.msg.v1.signer) = "sender";

  // DEPRECATED: This field is deprecated but must remain to ensure backward
  // compatibility. Removing this field would break decoding of historical
  // transactions. DO NOT use in new code.
  bytes sender_deprecated = 1 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    deprecated = true
  ];
  bytes controller = 2 [ (gogoproto.casttype) =
                             "github.com/cosmos/cosmos-sdk/types.AccAddress" ];
  string sender = 3 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}
message DeregisterControllerResponse {}

message UpdateParamsRequest {
  option (amino.name) = "permission/UpdateParams";
  option (permission.exported.v1beta1.permission_role) = ROLE_CHAIN_MANAGEMENT;
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  Params params = 2 [ (gogoproto.nullable) = false ];
}

message UpdateParamsResponse {}

// PauseRequest pauses the chain at the given level: only the messages
// allowlisted for that level are accepted, both as top-level messages and when
// executed by another message (authz, batch, refund, wasm, gov)
message PauseRequest {
  option (amino.name) = "permission/Pause";
  option (permission.exported.v1beta1.permission_role) = ROLE_ACCESS_CONTROL;
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  permission.exported.v1beta1.PauseLevel level = 2;
  string reason = 3;
}

message PauseResponse {}

// UnpauseRequest lifts an emergency pause
message UnpauseRequest {
  option (amino.name) = "permission/Unpause";
  option (permission.exported.v1beta1.permission_role) = ROLE_ACCESS_CONTROL;
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string reason = 2;
}

message UnpauseResponse {}

// HaltChainRequest schedules an upgrade plan at the next block height, which
// stops every node deterministically before that block is executed
message HaltChainRequest {
  option (amino.name) = "permission/HaltChain";
  option (permission.exported.v1beta1.permission_role) = ROLE_ACCESS_CONTROL;
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string reason = 2;
  // replace an already scheduled upgrade plan instead of failing
  bool override_pending_upgrade = 3;
}

message HaltChainResponse {
  int64 halt_height = 1;
  string plan_name = 2;
}
